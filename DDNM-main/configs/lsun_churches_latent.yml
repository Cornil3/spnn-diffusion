data:
    dataset: "LSUN_Churches"
    category: "church_outdoor"
    image_size: 256
    channels: 3
    logit_transform: false
    uniform_dequantization: false
    gaussian_dequantization: false
    random_flip: true
    rescaled: true
    num_workers: 32
    out_of_dist: false

model:
    type: "latent_compvis_ldm"
    var_type: fixedsmall
    # Unconditional — no guidance_scale needed
    guidance_scale: 1.0
    # Path to CompVis .ckpt file (no conversion needed)
    compvis_ckpt_path: "models/lsun_churches.ckpt"

codec:
    type: "spnn"
    spnn_checkpoint: "../checkpoints_churches/spnn_vae_epoch050.pt"
    spnn_mix_type: "cayley"
    spnn_hidden: 256
    spnn_scale_bound: 2.0
    # NOTE: CompVis LDM uses scale_by_std (baked into checkpoint).
    # The scaling factor is NOT 0.18215 — extract from checkpoint
    # with: ckpt['state_dict']['scale_factor']
    # Then set it here or handle in the codec loader.
    # Set to 1.0 to disable SD-style scaling in codec.
    compvis_scale_factor: 0.2458

diffusion:
    # CompVis "linear" = linspace(sqrt(start), sqrt(end), T)^2
    # which maps to DDNM's "quad" schedule
    beta_schedule: quad
    beta_start: 0.0015
    beta_end: 0.0155
    num_diffusion_timesteps: 1000

sampling:
    batch_size: 1

time_travel:
    T_sampling: 250
    travel_length: 1
    travel_repeat: 1
